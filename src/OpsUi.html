<style>
.zmap{display:flex;flex-direction:column;gap:10px}
.zfl{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.zfl h4{margin:0 0 8px;font-size:14px;color:var(--navy)}
.zgrid{display:flex;flex-wrap:wrap;gap:6px}
.zc{min-width:54px;min-height:40px;padding:4px 8px;border-radius:10px;border:1.5px solid #D5DBE3;background:var(--bg);font-size:12.5px;font-weight:700;color:var(--navy);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25}
.zc small{font-size:10px;font-weight:600;color:var(--muted)}
.zc.ok{background:#E3EFEA;border-color:#9CC4B5}
.zc.due{background:#FFF4E5;border-color:#E0A458}
.zc.ready{background:var(--tan);border-color:var(--gold)}
.zc.inf{background:#FBEFEC;border-color:#A4483A;color:#8E3A2E}
.zc.sel{outline:3px solid var(--navy);outline-offset:1px}
.zc.fac{border-style:dashed}
.zleg{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--ink2)}
.zleg i{display:inline-block;width:14px;height:14px;border-radius:4px;border:1.5px solid;vertical-align:-2px;margin-inline-end:4px}
.stars{display:flex;gap:8px;direction:ltr;justify-content:flex-end}
.stars button{width:52px;height:52px;border-radius:14px;border:1.5px solid #D5DBE3;background:#fff;font-size:24px;color:#C4C8CE}
.stars button.on{background:var(--tan);border-color:var(--gold);color:var(--goldD)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{min-height:56px;border-radius:14px;border:1.5px solid #D5DBE3;background:#fff;font-size:17px;font-weight:700;color:var(--navy)}
.yn button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.yn button.no.on{background:#8E3A2E;border-color:#8E3A2E}
.evk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
@media print{.hdr,.bnav,.foot,.noprint{display:none!important}.wrap{padding:0!important}.evp{border:0!important;box-shadow:none!important}}
</style>

 week:function(t){var d=new Date(t),day=(d.getDay()+1)%7;d.setHours(0,0,0,0);return d.getTime()-day*864e5},
 wasteSummary:function(visits,ho){visits=visits.filter(function(v){return v.status!=='rejected'});var now=Date.now(),wk=SV.week(now),h='',per=ho.wa?ho.wa.perWeek:0;

  var rated=visits.filter(function(v){return v.rating}),avg=rated.length?Math.round(rated.reduce(function(s,v){return s+v.rating},0)/rated.length*10)/10:null,came=visits.filter(function(v){return v.truck==='نعم'}),wash=came.length?Math.round(100*came.filter(function(v){return v.washed==='نعم'}).length/came.length):null;
  h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px"><div class="tile"><p class="k">هذا الأسبوع</p><p class="v">'+weeks[0].n+(per?' / '+per:'')+'</p><p class="s">رفع مكتمل'+(per?' مقابل المطلوب':'')+'</p></div><div class="tile"><p class="k">لم تحضر الشاحنة</p><p class="v" style="color:#8E3A2E">'+weeks.reduce(function(s,w){return s+w.noT},0)+'</p><p class="s">آخر 4 أسابيع</p></div><div class="tile"><p class="k">متوسط النظافة</p><p class="v">'+(avg==null?'—':avg+' / 5')+'</p><p class="s">من '+rated.length+' زيارة</p></div><div class="tile"><p class="k">الغسل بعد الترحيل</p><p class="v">'+(wash==null?'—':wash+'٪')+'</p><p class="s">من '+came.length+' زيارة</p></div></div>';
  var cs=ho.wa?ho.wa.start||0:0;weeks=weeks.filter(function(w,i){return i===0||w.a+7*864e5>cs});
  if(per)h+='<div class="card stack" style="gap:8px"><h3 style="font-size:15px">الرفع الأسبوعي مقابل العقد ('+per+' مرات)</h3>'+weeks.map(function(w,i){var pc=Math.min(100,Math.round(100*w.n/per)),miss=Math.max(0,per-w.n);return '<div><div class="row small"><span>'+(i===0?'هذا الأسبوع':'أسبوع '+dmy(w.a))+'</span><b style="color:'+(i>0&&miss?'#8E3A2E':'var(--navy)')+'">'+w.n+' / '+per+(i>0&&miss?' · فائت '+miss:'')+'</b></div><div style="height:8px;border-radius:6px;background:var(--mist);overflow:hidden"><i style="display:block;height:100%;width:'+pc+'%;background:'+(pc>=100?'#245244':i===0?'var(--gold)':'#A4483A')+'"></i></div></div>'}).join('')+'</div>';
  return h},
 visitRow:function(v){var rj=v.status==='rejected',can=!!(SV.b&&SV.b.canReject)&&!rj&&S.mode!=='con';

  var evs=b.evals||[];h+='<h2 style="font-size:17px">التقارير المحفوظة ('+evs.length+')</h2>'+(EV.list(evs,who)||'<div class="card muted" style="text-align:center">لا تقييمات صادرة بعد.</div>');
  return h+'</div>'}
};

(function(){var wr=W.render;W.render=function(){wr();if(!S.tok||!W.b||W.must)return;
  if(W.tab==='reports'){var wrap=document.querySelector('#app .wrap');if(wrap){var role=W.b.me.role,iss=role==='admin'||role==='engineer';var cons=(W.b.cons||[]).filter(function(c){return c.type!=='wt'&&(role==='admin'||['ac','el','sf'].indexOf(c.type)!==-1)});wrap.innerHTML=EV.panel(W.b,cons,iss,'W')}}
  var nav=document.querySelector('#app .topnav');if(nav&&!nav.querySelector('[data-rep]')){var bt=document.createElement('button');bt.setAttribute('data-rep','1');bt.textContent='التقارير';if(W.tab==='reports'){bt.className='on';[].forEach.call(nav.querySelectorAll('button'),function(x){if(x!==bt)x.className=''})}bt.onclick=function(){W.tab='reports';EV.f={};render()};nav.appendChild(bt)}}})();
render();
</script>
