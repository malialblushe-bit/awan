<style>
.zmap{display:flex;flex-direction:column;gap:10px}
.zfl{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}

.zgrid{display:flex;flex-wrap:wrap;gap:6px}

.zc small{font-size:10px;font-weight:600;color:var(--muted)}
.zc{border:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.zc small{color:inherit;opacity:.85}
.zc.none{background:var(--st-none);color:var(--st-noneT)}
.zc.ok{background:var(--st-ok);color:var(--st-okT)}
.zc.due{background:var(--st-due);color:var(--st-dueT)}
.zc.ready{background:var(--st-ready);color:#fff}
.zc.inf{background:var(--st-inf);color:#fff}
.zc.fac{box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.2)}
.zfs{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.zf.zero{opacity:.45}
.zf i{width:14px;height:14px;border-radius:4px;display:inline-block}

.tbtn{font:inherit;text-align:start;cursor:pointer;color:inherit}

.rail{display:none}

 body:has(.rail.staff){padding-bottom:74px}body:has(.rail.staff) .foot{bottom:66px}}
.subnav{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.subnav::-webkit-scrollbar{display:none}
.subnav button{flex:0 0 auto;min-height:46px;padding:0 16px;border:0;border-bottom:3px solid transparent;background:none;font:inherit;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer}

.zc.fac{border-style:dashed}

.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.evk{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
@media print{.hdr,.bnav,.foot,.noprint{display:none!important}.wrap{padding:0!important}.evp{border:0!important;box-shadow:none!important}}

    h+='<div><span class="lbl">القرار</span><div class="chips">'+EV.DEC.map(function(d){return '<button class="chip'+(f.dec===d?' on':'')+'" data-v="'+esc(d)+'" onclick="EV.f.dec=EV.f.dec===this.dataset.v?\'\':this.dataset.v;render()">'+esc(d)+'</button>'}).join('')+'</div></div><div><label class="lbl" for="evn">الملاحظة</label><textarea id="evn" class="inp" rows="3" oninput="EV.f.note=this.value">'+esc(f.note||'')+'</textarea></div><button class="btn btn-p"'+(f.dec?'':' disabled')+' onclick="call(\'apiEvalIssue\',S.tok,EV.f.con,EV.f.from,EV.f.to,EV.f.dec,EV.f.note||\'\').then(function(r){if(\''+who+'\'===\'SV\')SV.b=r.boot;else W.b=r.boot;EV.f={};toast(\'صدر التقييم وحُفظ في التقارير.\');render()})">إصدار التقييم</button>'}
   h+='</div>'}
  var evs=b.evals||[];h+='<h2 style="font-size:17px">التقارير المحفوظة ('+evs.length+')</h2>'+(EV.list(evs,who)||'<div class="card muted" style="text-align:center">لا تقييمات صادرة بعد.</div>');
  return h+'</div>'}
};

// ── التقارير في واجهة فريق التشغيل
(function(){var wr=W.render;W.render=function(){wr();if(!S.tok||!W.b||W.must)return;
  if(W.tab==='reports'){var wrap=document.querySelector('#app .wrap');if(wrap){var role=W.b.me.role,iss=role==='admin'||role==='engineer';var cons=(W.b.cons||[]).filter(function(c){return c.type!=='wt'&&(role==='admin'||['ac','el','sf'].indexOf(c.type)!==-1)});wrap.innerHTML=RPT.page('W',W.b,cons,iss)}}
  var nav=document.querySelector('#app .topnav');if(nav&&!nav.querySelector('[data-rep]')){var bt=document.createElement('button');bt.setAttribute('data-rep','1');bt.textContent='التقارير';if(W.tab==='reports'){bt.className='on';[].forEach.call(nav.querySelectorAll('button'),function(x){if(x!==bt)x.className=''})}bt.onclick=function(){W.tab='reports';EV.f={};render()};nav.appendChild(bt)}}})();
render();
</script>
