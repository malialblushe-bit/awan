var WT={st:{},pin:'',

  if(WT.done)return WT.doneView();
  if(!WT.tok)return WT.pinView();

 pinView:function(){var b=WT.b,d='';for(var i=0;i<6;i++)d+='<span class="dot'+(i<WT.pin.length?' on':'')+'"></span>';

  $('#app').innerHTML='<div class="pin"><div class="brand">'+LOGO+'<span>أعوان</span><small>'+esc(b.hotel.name)+'</small><span style="margin-inline-start:auto">'+langBtn()+'</span></div><div style="margin-top:24px;text-align:center"><p style="margin:0;color:var(--goldL);font-weight:600">باركود شاحنات المياه</p><h1 style="margin-top:8px;font-size:24px">اكتب رقمك السري</h1></div><div class="dots">'+d+'</div><p style="text-align:center;font-size:12.5px;color:#C9D3E0;margin:0">لسائق شاحنة المياه عند التفريغ · يُتحقق من وجودك في الموقع</p><div class="keys">'+k+'</div></div>'},
 press:function(k){if(k==='del'){WT.pin=WT.pin.slice(0,-1);return render()}if(WT.pin.length>=6)return;WT.pin+=k;render();if(WT.pin.length<6)return;var p=WT.pin;WT.pin='';
  toast('نتحقق من موقعك…');getGeo().then(function(g){return call('apiWtLogin',S.code,p,g).then(function(r){WT.tok=r.token;WT.who=r;WT.b=r.boot;WT.reset();render()})},function(e){toast(e.message,'err')}).catch(function(){render()})},

 formView:function(){var b=WT.b,s=WT.st,h=hdr(b.hotel.name,'<span class="pillh">شاحنات المياه</span>')+'<div class="wrap" style="max-width:560px"><div class="stack" style="gap:20px">';

  h+='<div><label class="lbl" for="wtn">ملاحظة (اختياري)</label><textarea id="wtn" class="inp" rows="2" oninput="WT.st.note=this.value">'+esc(s.note)+'</textarea></div>';

 // ── لوحة الفريق
 STL:{pending:['بانتظار المطابقة','st-review'],approved:['معتمدة','st-closed'],rejected:['مرفوضة','st-late']},

 row:function(x,can){var h='<div class="card stack" style="gap:6px;padding:12px 14px"><div class="row" style="flex-wrap:wrap;gap:6px"><span><b>'+F('{0} م³',x.size)+'</b> · <span data-nt="1">'+esc(x.driver)+'</span>'+(x.receipt?' · <span class="small">السند</span> <span dir="ltr">'+esc(x.receipt)+'</span>':'')+'</span><span>'+WT.pill(x)+'</span></div><span class="small muted">'+esc(x.hotel)+' · '+dmy(x.at)+' '+hm(x.at)+' · <span dir="ltr">'+esc(x.id)+'</span>'+(x.by?' · <span>طابقها</span> <span data-nt="1">'+esc(x.by)+'</span>':'')+'</span>'+(x.reason?'<span class="small" style="color:#8E3A2E">'+esc(x.reason)+'</span>':'')+(x.note?'<span class="small" data-nt="1">'+esc(x.note)+'</span>':'')+(x.photos.length?'<div class="photos">'+x.photos.map(thumb).join('')+'</div>':'');

 view:function(){var w=W.b.water,can=w.canMatch,pend=w.loads.filter(function(x){return x.status==='pending'}),h='<div class="stack"><h2 style="font-size:18px">شاحنات المياه</h2>';

  h+='<div class="stmt"><div class="row" style="align-items:flex-start;border-bottom:3px solid var(--navy);padding-bottom:10px"><div><b style="font-size:20px">كشف نقلات المياه</b><p class="small muted" style="margin:2px 0 0">أعوان · شركاء في الإنجاز</p></div><div style="text-align:end" class="small"><b>الفترة: <bdi>'+fd(r.from)+'</bdi> إلى <bdi>'+fd(r.to)+'</bdi></b><br>تاريخ الإصدار: '+dmy(Date.now())+'</div></div>';
  h+='<div class="kv" style="margin-top:12px"><div><span>المتعهد</span><b>'+esc(r.con.name)+'</b></div><div><span>الفندق</span><b>'+esc(r.hotels.join('، '))+'</b></div><div><span>عدد النقلات</span><b>'+r.count+'</b></div><div><span>إجمالي الكمية</span><b>'+F('{0} م³',r.vol.toLocaleString('en'))+'</b></div></div>';
  h+='<h3 style="font-size:15px;margin:16px 0 6px">ملخص الأحجام</h3><table class="bill"><thead><tr><th>الحجم</th><th>عدد النقلات</th><th>الكمية</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>'+r.lines.map(function(l){return '<tr><td>'+F('{0} م³',l.size)+'</td><td>'+l.qty+'</td><td>'+l.vol.toLocaleString('en')+'</td><td>'+money(l.price)+'</td><td><b>'+money(l.total)+'</b></td></tr>'}).join('')+'</tbody><tfoot><tr><td colspan="4">الإجمالي (ريال)</td><td>'+money(r.total)+'</td></tr></tfoot></table>';
  h+='<h3 style="font-size:15px;margin:16px 0 6px">تفاصيل النقلات</h3><table class="bill"><thead><tr><th>#</th><th>التاريخ</th><th>الوقت</th><th>الفندق</th><th>الحجم</th><th>السائق</th><th>السند</th><th>المبلغ</th></tr></thead><tbody>'+r.rows.map(function(x,i){return '<tr><td>'+(i+1)+'</td><td>'+dmy(x.at)+'</td><td>'+hm(x.at)+'</td><td>'+esc(x.hotel)+'</td><td>'+F('{0} م³',x.size)+'</td><td data-nt="1">'+esc(x.driver)+'</td><td dir="ltr">'+esc(x.receipt||'—')+'</td><td>'+money(x.price)+'</td></tr>'}).join('')+'</tbody></table>';
  h+='<p class="small muted" style="margin:10px 0 0">يشمل النقلات المعتمدة من إدارة الفندق بتاريخ التفريغ خلال الفترة. الأسعار حسب عقد المتعهد.'+(r.rejected?' '+F('{0} نقلات مرفوضة لم تدخل الكشف.',r.rejected):'')+'</p>';
  h+='<p class="small" style="margin:14px 0 0"><b>أُعد آلياً بواسطة نظام أعوان</b> · '+dmy(Date.now())+' '+hm(Date.now())+'</p>';
  h+='<div class="grid g2" style="margin-top:28px"><div style="border-top:1px solid var(--navy);padding-top:6px" class="small">مدير الفندق: الاسم والتوقيع</div><div style="border-top:1px solid var(--navy);padding-top:6px" class="small">المتعهد: الاسم والتوقيع والختم</div></div></div></div></div>';
  return h}
};

(function(){var r0=render,t0=themeNow;
 themeNow=function(){if(S.mode==='wt')return WT.b&&WT.b.hotel.brand;return t0()};
 render=function(){if(S.mode==='wt'){applyTheme(themeNow()||'');return WT.render()}return r0()}})();

(function(){var wr=W.render;W.render=function(){wr();if(!S.tok||!W.b||W.must||!W.b.water)return;
  if(W.tab==='wt'){var wrap=document.querySelector('#app .wrap');if(wrap)wrap.innerHTML=WT.view()}
  var nav=document.querySelector('#app .topnav');if(nav&&!nav.querySelector('[data-wt]')){var n=W.b.water.canMatch?W.b.water.loads.filter(function(x){return x.status==='pending'}).length:0;
   var bt=document.createElement('button');bt.setAttribute('data-wt','1');bt.textContent=T('المياه')+(n?' ('+n+')':'');if(W.tab==='wt'){[].forEach.call(nav.querySelectorAll('button'),function(x){x.className=''});bt.className='on'}
   bt.onclick=function(){W.tab='wt';W.modal=null;render()};var rep=nav.querySelector('[data-rep]');nav.insertBefore(bt,rep||null)}}})();

(function(){var home=C.homeView,perf=C.perfView,foot=C.footer;
 C.homeView=function(){if(C.b.me.type!=='wt')return home();var L=C.b.water||[];
  return '<div class="stack"><h2 style="font-size:17px">نقلاتي (35 يوماً)</h2><p class="small muted" style="margin:0">التسجيل من باركود شاحنات المياه في الفندق عند التفريغ.</p>'+(L.length?L.map(function(x){return WT.row(x,false)}).join(''):'<div class="card muted" style="text-align:center">لا نقلات بعد.</div>')+'</div>'};
 C.perfView=function(){return C.b.me.type==='wt'?C.homeView():perf()};
 C.footer=function(){return C.b&&C.b.me.type==='wt'?'':foot()}})();
render();
