<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#1F3A5F;--navy2:#2C4E78;--gold:#B07A35;--goldD:#8A5E26;--goldL:#E6C999;--red:#A4483A;--redD:#8E3A2E;--green:#245244;
--bg:#F5F7FA;--line:#E4E8EE;--muted:#5E6A7A;--ink2:#4A5A70;--mist:#EEF2F7;--sand:#FBF8F3;--tan:#F1E4CC;--pink:#FBEFEC;--mint:#E3EFEA}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--navy);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;color:inherit}
input,textarea,select{font:inherit;color:var(--navy)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hdr{background:var(--navy);color:#fff;padding:14px 18px;position:sticky;top:0;z-index:5}
.hdr-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700}
.brand small{font-size:12px;color:var(--goldL);font-weight:600}
.pillh{font-size:12px;font-weight:700;background:rgba(255,255,255,.14);border-radius:999px;padding:5px 11px}
.topnav{display:flex;gap:4px;flex-wrap:wrap}
.topnav button{border:0;background:none;color:#DCE4EF;font-weight:700;font-size:14px;padding:8px 12px;border-radius:10px}
.topnav button.on{background:rgba(255,255,255,.14);color:#fff}
.wrap{max-width:1240px;margin:0 auto;padding:16px 16px 90px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.grid{display:grid;gap:10px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.tile p{margin:0}.tile .k{font-size:12px;color:var(--muted);font-weight:600}.tile .v{font-size:26px;font-weight:700}.tile .s{font-size:11.5px;color:var(--muted)}
.btn{min-height:50px;border-radius:14px;border:0;padding:0 18px;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.w{width:100%}
.btn-p{background:var(--navy);color:#fff}.btn-p:hover{background:var(--navy2)}
.btn-g{background:var(--goldD);color:#fff}
.btn-r{background:#fff;color:var(--redD);border:1.5px solid var(--red)}
.btn-o{background:#fff;color:var(--navy);border:1.5px solid #C9D2DE}
.btn:disabled{background:#C4C8CE!important;color:#fff!important;border-color:#C4C8CE!important;cursor:not-allowed}
.sm{min-height:38px;font-size:13px;padding:0 12px;border-radius:10px}
.lbl{font-size:13.5px;font-weight:700;color:#3E4C5E;display:flex;gap:6px;align-items:center;margin:0 0 8px}
.req{color:var(--redD)}
.inp{width:100%;min-height:48px;border:1.5px solid #D5DBE3;border-radius:12px;padding:10px 13px;background:#fff;font-size:15px}
.inp:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(176,122,53,.2)}
textarea.inp{resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;border-radius:12px;border:1.5px solid #D5DBE3;background:#fff;padding:0 12px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.add{border-style:dashed;color:var(--goldD);border-color:var(--gold)}
.opt{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:right;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;width:100%}
.opt.on{border-color:var(--navy);box-shadow:0 0 0 3px #DCE4EF}
.opt b{font-size:15.5px}.opt span{font-size:13px;color:var(--ink2)}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-block}
.st-assigned{background:var(--mist)}.st-in_progress{background:#DCE4EF}.st-review,.st-decision,.st-pay,.st-matching,.st-parts{background:var(--tan);color:#6E4A17}
.st-rejected,.st-late{background:var(--pink);color:var(--redD)}.st-closed{background:var(--mint);color:var(--green)}
.job{display:flex;flex-direction:column;gap:5px;text-align:right;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.job.on{border-color:var(--navy);box-shadow:0 0 0 3px #DCE4EF}
.job .id{font-size:12px;color:var(--muted);font-weight:600;direction:ltr}
.job .t{font-size:16px;font-weight:700}.job .l{font-size:13px;color:var(--ink2)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.alert{border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.7}
.a-red{background:var(--pink);border:1.5px solid var(--red);color:var(--redD)}
.a-tan{background:var(--tan);color:#6E4A17}
.a-mint{background:var(--mint);color:var(--green);font-weight:700}
.a-sand{background:var(--sand);color:var(--ink2)}
.stack{display:flex;flex-direction:column;gap:14px}
.split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start}
.split>.side{flex:1 1 330px;min-width:0;display:flex;flex-direction:column;gap:10px}
.split>.main{flex:999 1 520px;min-width:0}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kv div{background:var(--bg);border-radius:12px;padding:9px 12px}.kv span{display:block;font-size:12px;color:var(--muted)}.kv b{font-size:14px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{min-height:40px;border:0;background:none;border-bottom:3px solid transparent;padding:0 10px;font-size:13.5px;font-weight:700;color:var(--muted)}
.tabs button.on{color:var(--navy);border-bottom-color:var(--gold)}
.bnav{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:2px 8px 8px;z-index:6}
.bnav button{flex:1;border:0;background:none;font-size:12.5px;font-weight:700;color:var(--muted);padding:10px 0 4px;min-height:56px;border-top:4px solid transparent}
.bnav button.on{color:var(--navy);border-top-color:var(--gold)}
.foot{position:fixed;bottom:0;inset-inline:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;gap:10px;z-index:6}
.foot-in{max-width:1240px;margin:0 auto;display:flex;gap:10px;width:100%}
.pin{min-height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;padding:28px 24px 24px;gap:18px;max-width:480px;margin:0 auto}
.dots{display:flex;justify-content:center;gap:14px;direction:ltr}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,.5)}.dot.on{background:var(--goldL);border-color:var(--goldL)}
.keys{margin-top:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;direction:ltr}
.key{height:62px;border-radius:16px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:24px;font-weight:600}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:96px;height:72px;object-fit:cover;border-radius:10px;background:var(--mist)}
.photo-btn{width:100%;min-height:52px;border-radius:12px;border:1.5px dashed var(--gold);background:var(--sand);color:#6E4A17;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.photo-btn.has{border:1.5px solid var(--green);background:var(--mint);color:var(--green)}
.modal{position:fixed;inset:0;background:rgba(20,32,50,.55);display:grid;place-items:center;padding:16px;z-index:20}
.modal>div{width:100%;max-width:620px;max-height:92vh;overflow-y:auto;background:#fff;border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;top:14px;inset-inline:14px;max-width:560px;margin:0 auto;z-index:30;border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.15)}
.busy{position:fixed;inset:0;background:rgba(245,247,250,.6);display:grid;place-items:center;z-index:25}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--mist);border-top-color:var(--gold);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.step{display:flex;gap:6px;margin-top:10px}.step i{flex:1;height:5px;border-radius:9px;background:rgba(255,255,255,.25)}.step i.on{background:var(--gold)}
.cat{display:flex;flex-direction:column;gap:8px;align-items:flex-start;text-align:right;padding:18px;border-radius:18px;border:1.5px solid var(--line);background:#fff;min-height:140px}
.cat.on{border-color:var(--navy);box-shadow:0 0 0 3px #DCE4EF}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}.small{font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:14px}th{font-size:12.5px;color:var(--muted);font-weight:600;text-align:right;padding:8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid #EEF2F7}
@media (min-width:900px){.only-m{display:none}}
.drawer-bg{position:fixed;inset:0;background:rgba(20,32,50,.45);z-index:15}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(660px,100vw);background:var(--bg);z-index:16;overflow-y:auto;box-shadow:0 0 40px rgba(0,0,0,.25);display:flex;flex-direction:column}
.drawer-h{position:sticky;top:0;background:var(--navy);color:#fff;padding:14px 16px 0;z-index:2}
.drawer-h .tabs{border:0;margin-top:10px}.drawer-h .tabs button{color:#C9D3E0}.drawer-h .tabs button.on{color:#fff}
.drawer-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.ib{min-width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;padding:0 8px}
.ib.red{color:var(--redD);border-color:#E7C2BB}
.fx{display:inline-flex;align-items:center;gap:6px;background:var(--mist);border-radius:10px;padding:6px 6px 6px 10px;font-size:13px;font-weight:600}
.fx button{border:0;background:none;color:var(--redD);font-weight:700;padding:0 4px}
.hcard{display:flex;flex-direction:column;gap:10px;text-align:right;background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px}
.nums{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.nums div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}.nums b{display:block;font-size:18px}.nums span{font-size:11px;color:var(--muted)}
.brow{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr)) 36px;gap:6px;align-items:center}
.brow .inp{min-height:42px;padding:6px 8px;font-size:14px}
.ecard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
.espec{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.espec div{background:var(--bg);border-radius:10px;padding:6px 8px}.espec span{display:block;font-size:11px;color:var(--muted)}.espec b{font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="busy"></div>
<script>var BOOT = <?!= boot ?>;</script>
<script>
// ═════════ أدوات عامة ═════════
var S = { mode: BOOT.mode, code: BOOT.hotel };
var LOGO = '<svg width="30" height="30" viewBox="0 0 56 56" aria-hidden="true"><rect x="4" y="12" width="30" height="30" rx="9" fill="#B07A35"></rect><rect x="22" y="12" width="30" height="30" rx="9" fill="none" stroke="#FFFFFF" stroke-width="4"></rect></svg>';
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function call(fn){var args=[].slice.call(arguments,1);busy(true);return new Promise(function(res,rej){google.script.run.withSuccessHandler(function(r){busy(false);res(r)}).withFailureHandler(function(e){busy(false);var m=(e&&e.message)||String(e);if(/الجلسة/.test(m)){clearTok();}toast(m,'err');rej(e)})[fn].apply(null,args)})}
function busy(on){$('#busy').innerHTML=on?'<div class="busy"><div class="spin"></div></div>':''}
var toastT;function toast(m,kind){clearTimeout(toastT);$('#toast').innerHTML='<div class="toast" role="status" style="background:'+(kind==='err'?'#FBEFEC;color:#8E3A2E':'#E3EFEA;color:#245244')+'">'+esc(m)+'</div>';toastT=setTimeout(function(){$('#toast').innerHTML=''},kind==='err'?6000:4000)}
function store(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}}
function load(k){try{return sessionStorage.getItem(k)}catch(e){return null}}
function tokKey(){return 'awan_tok_'+(S.mode||'staff')+'_'+(S.code||'')}
function clearTok(){S.tok=null;store(tokKey(),null);setTimeout(render,50)}
function hm(t){return t?new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'}):''}
function dmy(t){return t?new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'Asia/Riyadh'}):''}
function dur(min){if(min==null||isNaN(min))return '—';min=Math.round(min);if(min<60)return min+' د';var h=min/60;return (h<10?Math.round(h*10)/10:Math.round(h))+' س'}
function ago(t){if(!t)return '';return 'منذ '+dur((Date.now()-t)/60000)}
function mins(a,b){return (a&&b)?(b-a)/60000:null}
function hdr(sub,right,nav){return '<header class="hdr"><div class="hdr-in"><div class="brand">'+LOGO+'<span>أعوان</span>'+(sub?'<small>'+esc(sub)+'</small>':'')+'</div>'+(nav||'')+'<div style="margin-inline-start:auto;display:flex;gap:8px;align-items:center">'+(right||'')+'</div></div></header>'}
function compress(file){return new Promise(function(res){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var m=1280,w=img.width,h=img.height,sc=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};img.onerror=function(){res(null)};img.src=r.result};r.readAsDataURL(file)})}
function pickPhotos(cb){var i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=function(){Promise.all([].slice.call(i.files).slice(0,4).map(compress)).then(function(a){cb(a.filter(Boolean))})};i.click()}
function thumb(id){return '<a href="https://drive.google.com/file/d/'+esc(id)+'/view" target="_blank" rel="noopener"><img alt="صورة" src="https://drive.google.com/thumbnail?id='+esc(id)+'&sz=w320"></a>'}
var STLBL={assigned:'مُسند',in_progress:'قيد التنفيذ',review:'قيد المراجعة',decision:'بانتظار قرارك',pay:'بانتظار السداد',parts:'بانتظار قطعة',matching:'بانتظار المطابقة',closed:'مغلق',rejected:'مرفوض'};
var TYPE={ac:'تكييف',el:'مصاعد',sf:'سلامة'};

function render(){
  if(S.mode==='req')return R.render();
  if(S.mode==='con')return C.render();
  return W.render();
}

// ═════════ فريق العمل: رفع طلب ═════════
var R={st:{step:1,type:'',floor:'',room:'',equip:'',sym:'',trapped:'',desc:'',name:'',photos:[]},
 init:function(){call('apiReqBoot',S.code).then(function(b){R.b=b;render()}).catch(function(){R.err=true;render()})},
 set:function(k,v){R.st[k]=v;render()},
 render:function(){
  var s=R.st,b=R.b;
  if(R.err)return $('#app').innerHTML=hdr('رفع طلب')+'<div class="wrap"><div class="alert a-red">الباركود غير صحيح أو الفندق غير مفعّل. أبلغ مهندس الصيانة.</div></div>';
  if(!b){R.init();return $('#app').innerHTML=hdr('رفع طلب')}
  var titles={1:'نوع المشكلة',2:'الموقع والوصف',3:'اسمك والإرسال'};
  var h='<header class="hdr"><div class="hdr-in" style="max-width:560px"><div class="brand">'+LOGO+'<span>أعوان</span><small>رفع طلب</small></div><span class="pillh" style="margin-inline-start:auto">'+esc(b.hotel.name)+'</span></div>';
  if(s.step<4)h+='<div style="max-width:560px;margin:12px auto 0"><div class="row small"><b>'+titles[s.step]+'</b><span style="color:#E6C999">الخطوة '+s.step+' من 3</span></div><div class="step"><i class="on"></i><i class="'+(s.step>1?'on':'')+'"></i><i class="'+(s.step>2?'on':'')+'"></i></div></div>';
  h+='</header><div class="wrap" style="max-width:560px"><div class="stack">';
  var isEl=s.type==='el';
  if(s.step===1){
    h+='<h2 style="font-size:24px">ما نوع المشكلة؟</h2><div class="grid g2">';
    [['ac','تكييف','غرفة، ممر، مطعم أو أي مرفق'],['el','مصاعد','مصاعد النزلاء أو الخدمة']].forEach(function(c){
      if(!b.has[c[0]])return;
      h+='<button class="cat'+(s.type===c[0]?' on':'')+'" onclick="R.st.sym=\'\';R.st.trapped=\'\';R.set(\'type\',\''+c[0]+'\')"><b style="font-size:20px">'+c[1]+'</b><span class="small" style="color:#4A5A70">'+c[2]+'</span></button>'});
    h+='</div>';
    if(!b.has.ac&&!b.has.el)h+='<div class="alert a-tan">لا توجد عقود سارية لهذا الفندق بعد.</div>';
    h+='<div class="alert a-sand">لا تعرف التصنيف بدقة؟ اختر الأقرب، والمهندس يعيد توجيه الطلب عند الحاجة.</div>';
  }
  if(s.step===2){
    if(isEl){h+='<div><span class="lbl">أي مصعد؟</span><div class="chips">'+b.elevators.map(function(e){return '<button class="chip'+(s.equip===e?' on':'')+'" data-v="'+esc(e)+'" onclick="R.set(\'equip\',this.dataset.v)">'+esc(e)+'</button>'}).join('')+'</div></div>'}
    else{var tws=(b.hotel.towers||[]);if(tws.length)h+='<div><span class="lbl">البرج</span><div class="chips">'+tws.map(function(t){return '<button class="chip'+(s.tower===t?' on':'')+'" data-v="'+esc(t)+'" onclick="R.st.floor=\'\';R.st.room=\'\';R.set(\'tower\',this.dataset.v)">'+esc(A.tn(t))+'</button>'}).join('')+'</div></div>';
     if(!tws.length||s.tower)h+='<div><span class="lbl">الدور</span><div class="chips" style="max-height:220px;overflow-y:auto">'+b.floors.filter(function(f){return !tws.length||!f.tower||f.tower===s.tower}).map(function(f){return '<button class="chip'+(s.floor===f.id?' on':'')+'" onclick="R.st.room=\'\';R.set(\'floor\',\''+f.id+'\')">'+esc(f.name)+'</button>'}).join('')+'</div></div>';
      var fl=b.floors.filter(function(f){return f.id===s.floor})[0];
      if(fl&&fl.facilities.length)h+='<div><span class="lbl">'+(fl.kind==='rooms'?'مرفق في هذا الدور (أو اكتب رقم الغرفة)':'أين بالتحديد؟')+'</span><div class="chips">'+fl.facilities.map(function(x){return '<button class="chip'+(s.room===x?' on':'')+'" data-v="'+esc(x)+'" onclick="R.set(\'room\',R.st.room===this.dataset.v?\'\':this.dataset.v)">'+esc(x)+'</button>'}).join('')+'</div></div>';

   return '<div class="card stack"><h2 style="font-size:17px">'+esc(h.name)+'</h2><div class="grid gauto">'+[['باركود الطلبات','للاستقبال والميدان',r,'#EEF2F7'],['باركود أعوان','للمتعهدين عند المدخل أو مكتب الصيانة',c,'#F7F1E7']].map(function(x){return '<div style="border:1px solid #E4E8EE;border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center"><img alt="'+x[0]+'" src="'+q(x[2])+'" style="width:180px;height:180px;border-radius:12px;background:'+x[3]+'"><b>'+x[0]+'</b><span class="small muted">'+x[1]+'</span><a class="btn btn-o sm" href="'+q(x[2])+'" target="_blank" rel="noopener">فتح للطباعة</a><a class="small" href="'+esc(x[2])+'" target="_blank" rel="noopener">تجربة الرابط</a></div>'}).join('')+'</div></div>'}).join('')+'</div>'}
};

render();
</script>
