<script>var BOOT = <?!= boot ?>;</script>
<script>
// ═════════ أدوات عامة ═════════
var S = { mode: BOOT.mode, code: BOOT.hotel };
try{if(!S.mode&&sessionStorage.getItem('awan_tok_conweb'))S.mode='con'}catch(e){}
var LOGO = '<svg width="30" height="30" viewBox="0 0 56 56" aria-hidden="true"><rect x="4" y="12" width="30" height="30" rx="9" fill="#B07A35"></rect><rect x="22" y="12" width="30" height="30" rx="9" fill="none" stroke="#FFFFFF" stroke-width="4"></rect></svg>';
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function call(fn){var args=[].slice.call(arguments,1);busy(true);return new Promise(function(res,rej){google.script.run.withSuccessHandler(function(r){busy(false);res(r)}).withFailureHandler(function(e){busy(false);var m=(e&&e.message)||String(e);if(/الجلسة/.test(m)){clearTok();}toast(m,'err');rej(e)})[fn].apply(null,args)})}
function busy(on){$('#busy').innerHTML=on?'<div class="busy"><div class="spin"></div></div>':''}
var toastT;function toast(m,kind){clearTimeout(toastT);$('#toast').innerHTML='<div class="toast" role="status" style="background:'+(kind==='err'?'#FBEFEC;color:#8E3A2E':'#E3EFEA;color:#245244')+'">'+esc(m)+'</div>';toastT=setTimeout(function(){$('#toast').innerHTML=''},kind==='err'?6000:4000)}
function store(k,v){try{if(v==null)sessionStorage.removeItem(k);else sessionStorage.setItem(k,v)}catch(e){}}

function tokKey(){if(S.mode==='con'&&!S.code)return 'awan_tok_conweb';return 'awan_tok_'+(S.mode||'staff')+'_'+(S.code||'')}
function clearTok(){S.tok=null;store(tokKey(),null);setTimeout(render,50)}
function hm(t){return t?new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Asia/Riyadh'}):''}
function dmy(t){return t?new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'Asia/Riyadh'}):''}

function ago(t){if(!t)return '';var d=dur((Date.now()-t)/60000);return (typeof LANG!=='undefined'&&LANG==='en')?d+' ago':'منذ '+d}
function mins(a,b){return (a&&b)?(b-a)/60000:null}

function compress(file){return new Promise(function(res){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var m=1280,w=img.width,h=img.height,sc=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};img.onerror=function(){res(null)};img.src=r.result};r.readAsDataURL(file)})}
function pickPhotos(cb){var i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=true;i.onchange=function(){Promise.all([].slice.call(i.files).slice(0,4).map(compress)).then(function(a){cb(a.filter(Boolean))})};i.click()}

  h+='<div class="stack" style="gap:8px">'+act.map(function(x){return '<div class="lrow"><input class="inp" aria-label="بالعربية" value="'+esc(x.ar)+'"><input class="inp" dir="ltr" aria-label="English" placeholder="English" value="'+esc(x.en)+'"><button class="btn btn-o sm" onclick="var r=this.parentNode.children;A.run(\'apiAdmListSave\',{id:\''+x.id+'\',ar:r[0].value,en:r[1].value}).then(function(){toast(\'حُفظ.\');render()})">حفظ</button></div>'}).join('')+'</div>';

  return h+'</div>'},
 KPIN:[['resp','الاستجابة','متوسط زمن الوصول بالدقائق: الأقل أفضل، فحد كامل النقاط أقل من حد النصف.','د'],['ready','الجاهزية','نسبة ما أُغلق من أول مرة، بلا إعادة فتح، ولا تكرار عطل لنفس الموقع خلال 30 يوماً.','٪'],['info','موثوقية المعلومات','نسبة التقارير التي قُبلت عند المراجعة بلا إعادة فتح ولا فحص مغاير ولا رفض.','٪'],['sat','رضا المتعاملين','تقييم المهندس عند الإغلاق: راضٍ 100، مقبول 50، غير راضٍ 0.','٪']],
 th:function(){var a=W.a,f=A.f,t=f.tt||'ac';f.tv=f.tv||{};var cur=f.tv[t]||(f.tv[t]=JSON.parse(JSON.stringify(a.thresholds[t]||{})));
  var sum=A.KPIN.reduce(function(s,k){return s+(Number((cur[k[0]]||{}).weight)||0)},0);
  var h='<div class="stack"><div class="card stack"><div><h2 style="font-size:17px">عتبات الأداء</h2><p class="small muted" style="margin:4px 0 0">لكل نوع متعهد: يأخذ المؤشر كامل وزنه إن بلغ حد كامل النقاط، ونصفه إن بلغ حد النصف، وصفراً دون ذلك. مجموع الأوزان 100.</p></div>';
  h+='<div class="chips">'+[['ac','تكييف'],['el','مصاعد'],['sf','سلامة']].map(function(x){return '<button class="chip'+(t===x[0]?' on':'')+'" onclick="A.f.tt=\''+x[0]+'\';render()">'+x[1]+'</button>'}).join('')+'</div>';
  h+='<div class="th small muted" style="font-weight:700"><span>المؤشر</span><span>كامل النقاط</span><span>نصف النقاط</span><span>الوزن ٪</span></div>';
  A.KPIN.forEach(function(k){var r=cur[k[0]]||(cur[k[0]]={full:'',half:'',weight:''});
   h+='<div class="th"><div><b>'+k[1]+'</b> <span class="small muted">('+k[3]+')</span><p class="small muted" style="margin:2px 0 0">'+k[2]+'</p></div>'+['full','half','weight'].map(function(x){return '<input class="inp" inputmode="decimal" aria-label="'+k[1]+' — '+({full:'كامل النقاط',half:'نصف النقاط',weight:'الوزن'}[x])+'" value="'+esc(r[x])+'" oninput="A.f.tv[\''+t+'\'][\''+k[0]+'\'][\''+x+'\']=this.value;A.thSum()">'}).join('')+'</div>'});
  h+='<p id="thsum" class="small" style="margin:0;font-weight:700;color:'+(sum===100?'#245244':'#8E3A2E')+'">مجموع الأوزان: '+sum+' من 100</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-p" onclick="A.run(\'apiAdmSaveThresholds\',\''+t+'\',A.f.tv[\''+t+'\']).then(function(){delete A.f.tv[\''+t+'\'];toast(\'حُفظت العتبات.\');render()})">حفظ العتبات</button><button class="btn btn-o" onclick="A.run(\'apiAdmKpiRebuild\').then(function(r){toast(\'أُعيد حساب الأرقام.\');P.d=null;render()})">إعادة حساب الأرقام</button></div></div></div>';
  return h},
 thSum:function(){var t=A.f.tt||'ac',cur=A.f.tv[t],sum=A.KPIN.reduce(function(s,k){return s+(Number((cur[k[0]]||{}).weight)||0)},0),e=$('#thsum');if(e){e.textContent='مجموع الأوزان: '+sum+' من 100';e.style.color=sum===100?'#245244':'#8E3A2E'}},
 qr:function(){var a=W.a;if(!a.webUrl)return '<div class="alert a-tan">يظهر رابط الباركود بعد النشر الأول للتطبيق.</div>';
  var q=function(u){return 'https://api.qrserver.com/v1/create-qr-code/?size=600x600&margin=10&data='+encodeURIComponent(u)};
  return '<div class="stack">'+a.hotels.map(function(h){var r=a.webUrl+'?h='+h.code+'&m=req',c=a.webUrl+'?h='+h.code+'&m=con';
   return '<div class="card stack"><h2 style="font-size:17px">'+esc(h.name)+'</h2><div class="grid gauto">'+[['باركود الطلبات','للاستقبال والميدان',r,'#EEF2F7'],['باركود أعوان','للمتعهدين عند المدخل أو مكتب الصيانة',c,'#F7F1E7']].map(function(x){return '<div style="border:1px solid #E4E8EE;border-radius:16px;padding:16px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center"><img alt="'+x[0]+'" src="'+q(x[2])+'" style="width:180px;height:180px;border-radius:12px;background:'+x[3]+'"><b>'+x[0]+'</b><span class="small muted">'+x[1]+'</span><a class="btn btn-o sm" href="'+q(x[2])+'" target="_blank" rel="noopener">فتح للطباعة</a><a class="small" href="'+esc(x[2])+'" target="_blank" rel="noopener">تجربة الرابط</a></div>'}).join('')+'</div></div>'}).join('')+'</div>'}
};

// ═════════ لوحات الأداء (تقرأ الملخص المحسوب مسبقاً) ═════════
var P={d:null,m:null,h:'all',c:null,
 load:function(){return call('apiKpiBoot',S.tok).then(function(d){P.d=d;if(!P.m)P.m=d.month;render()})},
 months:function(){var ms={};P.d.rows.forEach(function(r){ms[r.month]=1});ms[P.d.month]=1;return Object.keys(ms).sort().reverse().slice(0,6)},
 mlabel:function(m){var d=new Date(m+'-15T12:00:00');return d.toLocaleDateString(LANG==='en'?'en-GB':'ar-SA-u-nu-latn-ca-gregory',{month:'long',year:'numeric'})},
 agg:function(rows){var z={orders:0,closed:0,respSum:0,respN:0,readyOk:0,readyN:0,infoOk:0,infoN:0,satSum:0,satN:0,trapped:0,rescueSum:0,rescueN:0,downMin:0,downN:0,parts:{},causes:{},syms:{},locs:{}};
  rows.forEach(function(r){var d=r.d||{};Object.keys(z).forEach(function(k){if(typeof z[k]==='number')z[k]+=Number(d[k])||0;else Object.keys(d[k]||{}).forEach(function(n){z[k][n]=(z[k][n]||0)+d[k][n]})})});return z},
 vals:function(z){return {resp:z.respN?z.respSum/z.respN:null,ready:z.readyN?100*z.readyOk/z.readyN:null,info:z.infoN?100*z.infoOk/z.infoN:null,sat:z.satN?z.satSum/z.satN:null,n:{resp:z.respN,ready:z.readyN,info:z.infoN,sat:z.satN}}},
 factor:function(k,v,t){if(v==null||!t)return null;if(k==='resp')return v<=t.full?1:v<=t.half?0.5:0;return v>=t.full?1:v>=t.half?0.5:0},
 score:function(V,th){var w=0,s=0;['resp','ready','info','sat'].forEach(function(k){var t=(th||{})[k],f=P.factor(k,V[k],t);if(f==null)return;w+=t.weight;s+=t.weight*f});return w?Math.round(100*s/w):null},
 view:function(who){var d=P.d;if(!d){P.load();return '<div class="card muted" style="text-align:center">…</div>'}
  var con=who==='con';
  if(!d.cons.length)return '<div class="stack"><h2 style="font-size:18px">'+(con?'أدائي':'الأداء')+'</h2><div class="card muted" style="text-align:center;line-height:1.8">لا توجد أرقام بعد. تظهر بعد أول عمليات مسجلة.</div></div>';
  if(!P.c||!d.cons.some(function(c){return c.id===P.c}))P.c=d.cons[0].id;
  var c=d.cons.filter(function(x){return x.id===P.c})[0],th=d.thresholds[c.type]||{};
  var rows=d.rows.filter(function(r){return r.con===c.id&&r.month===P.m&&(P.h==='all'||r.hotel===P.h)});
  var z=P.agg(rows),V=P.vals(z),sc=P.score(V,th);
  var h='<div class="stack"><div class="row" style="flex-wrap:wrap"><h2 style="font-size:18px">'+(con?'أدائي':'الأداء')+'</h2><select class="inp" style="width:auto;min-height:40px" aria-label="الشهر" onchange="P.m=this.value;render()">'+P.months().map(function(m){return '<option value="'+m+'"'+(m===P.m?' selected':'')+'>'+P.mlabel(m)+'</option>'}).join('')+'</select></div>';
  if(!con&&d.cons.length>1)h+='<div class="chips">'+d.cons.map(function(x){return '<button class="chip'+(x.id===P.c?' on':'')+'" onclick="P.c=\''+x.id+'\';render()">'+esc(x.name)+' <span class="muted" style="font-weight:500">· '+TYPE[x.type]+'</span></button>'}).join('')+'</div>';
  if(d.hotels.length>1)h+='<div class="chips">'+[{id:'all',name:'كل الفنادق'}].concat(d.hotels).map(function(x){return '<button class="chip'+(P.h===x.id?' on':'')+'" style="min-height:36px" onclick="P.h=\''+x.id+'\';render()">'+esc(x.name)+'</button>'}).join('')+'</div>';
  h+='<div class="score"><div><span>الدرجة</span><br><b>'+(sc==null?'—':sc)+'</b> <span>من 100</span></div><div style="margin-inline-start:auto;text-align:end"><b style="font-size:18px">'+esc(c.name)+'</b><br><span>'+TYPE[c.type]+' · '+z.orders+' عملية · '+z.closed+' مغلقة</span></div></div>';
  h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">'+A.KPIN.map(function(k){var v=V[k[0]],t=th[k[0]]||{},f=P.factor(k[0],v,t);
   var shown=v==null?'—':(k[0]==='resp'?dur(v):Math.round(v)+'٪');var goal=k[0]==='resp'?'الهدف ≤ '+t.full+' د':'الهدف ≥ '+t.full+'٪';
   return '<div class="kpi '+(f==null?'fn':f===1?'f1':f===0.5?'f5':'f0')+'"><span class="k">'+k[1]+'</span><span class="v">'+shown+'</span><span class="s">'+goal+'</span><span class="s">من '+V.n[k[0]]+' عملية</span></div>'}).join('')+'</div>';
  if(c.type==='el')h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"><div class="tile"><p class="k">حالات احتجاز</p><p class="v">'+z.trapped+'</p></div><div class="tile"><p class="k">متوسط زمن الإنقاذ</p><p class="v">'+(z.rescueN?dur(z.rescueSum/z.rescueN):'—')+'</p><p class="s">من '+z.rescueN+' عملية</p></div><div class="tile"><p class="k">توقف المصاعد</p><p class="v">'+(z.downN?dur(z.downMin):'—')+'</p><p class="s">من '+z.downN+' عملية</p></div></div>';
  var bars=function(t,o){var ks=Object.keys(o).sort(function(a,b){return o[b]-o[a]}).slice(0,5),mx=ks.length?o[ks[0]]:1;return '<div class="card stack" style="gap:10px"><h3 style="font-size:15px">'+t+'</h3>'+(ks.length?'<div class="bars">'+ks.map(function(k){return '<div class="bar"><div><span>'+esc(k)+'</span><i style="width:'+Math.max(6,Math.round(100*o[k]/mx))+'%"></i></div><em>'+o[k]+'</em></div>'}).join('')+'</div>':'<p class="small muted" style="margin:0">لا بيانات بعد.</p>')+'</div>'};
  h+='<h3 style="font-size:16px;margin-top:4px">أنماط الأعطال</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">'+bars('أكثر الأجزاء تعطلاً',z.parts)+bars('أكثر الأسباب',z.causes)+bars(c.type==='el'?'أكثر المصاعد بلاغات':'أكثر المواقع بلاغات',z.locs)+'</div>';
  h+='<p class="small muted" style="margin:0;line-height:1.8">الأرقام لطلبات الشهر المختار (حسب تاريخ رفعها)، وتُحدَّث مع كل إجراء. تحت كل نسبة عدد العمليات التي حُسبت منها. البنود الجديدة تُحسب «أخرى» حتى يعتمدها المشرف.</p>';
  return h+'</div>'}
};

render();
</script>
