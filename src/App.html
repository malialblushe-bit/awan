function compress(file){return new Promise(function(res){var r=new FileReader();r.onload=function(){var img=new Image();img.onload=function(){var m=1280,w=img.width,h=img.height,sc=Math.min(1,m/Math.max(w,h));var c=document.createElement('canvas');c.width=Math.round(w*sc);c.height=Math.round(h*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72))};img.onerror=function(){res(null)};img.src=r.result};r.readAsDataURL(file)})}

  var h='<div class="stack"><div class="row" style="flex-wrap:wrap"><h2 style="font-size:18px">'+(con?'أدائي':'الأداء')+'</h2><select class="inp" style="width:auto;min-height:40px" aria-label="الشهر" onchange="P.m=this.value;render()">'+P.months().map(function(m){return '<option value="'+m+'"'+(m===P.m?' selected':'')+'>'+P.mlabel(m)+'</option>'}).join('')+'</select></div>';
  if(!con&&d.cons.length>1)h+='<div class="chips">'+d.cons.map(function(x){return '<button class="chip'+(x.id===P.c?' on':'')+'" onclick="P.c=\''+x.id+'\';render()">'+esc(x.name)+' <span class="muted" style="font-weight:500">· '+TYPE[x.type]+'</span></button>'}).join('')+'</div>';
  if(d.hotels.length>1)h+='<div class="chips">'+[{id:'all',name:'كل الفنادق'}].concat(d.hotels).map(function(x){return '<button class="chip'+(P.h===x.id?' on':'')+'" style="min-height:36px" onclick="P.h=\''+x.id+'\';render()">'+esc(x.name)+'</button>'}).join('')+'</div>';
  h+='<div class="score"><div><span>الدرجة</span><br><b>'+(sc==null?'—':sc)+'</b> <span>من 100</span></div><div style="margin-inline-start:auto;text-align:end"><b style="font-size:18px">'+esc(c.name)+'</b><br><span>'+TYPE[c.type]+' · '+z.orders+' عملية · '+z.closed+' مغلقة</span></div></div>';
  h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">'+A.KPIN.map(function(k){var v=V[k[0]],t=th[k[0]]||{},f=P.factor(k[0],v,t);
   var shown=v==null?'—':(k[0]==='resp'?dur(v):Math.round(v)+'٪');var goal=k[0]==='resp'?'الهدف ≤ '+t.full+' د':'الهدف ≥ '+t.full+'٪';
   return '<div class="kpi '+(f==null?'fn':f===1?'f1':f===0.5?'f5':'f0')+'"><span class="k">'+k[1]+'</span><span class="v">'+shown+'</span><span class="s">'+goal+'</span><span class="s">من '+V.n[k[0]]+' عملية</span></div>'}).join('')+'</div>';
  if(c.type==='el')h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"><div class="tile"><p class="k">حالات احتجاز</p><p class="v">'+z.trapped+'</p></div><div class="tile"><p class="k">متوسط زمن الإنقاذ</p><p class="v">'+(z.rescueN?dur(z.rescueSum/z.rescueN):'—')+'</p><p class="s">من '+z.rescueN+' عملية</p></div><div class="tile"><p class="k">توقف المصاعد</p><p class="v">'+(z.downN?dur(z.downMin):'—')+'</p><p class="s">من '+z.downN+' عملية</p></div>'+(function(){var tg=0;(d.hotels.length?d.hotels:[{id:''}]).forEach(function(x){if(P.h==='all'||P.h===x.id)tg+=((d.pmTarget||{})[c.id+'|'+x.id]||0)});return '<div class="tile"><p class="k">الصيانة الدورية</p><p class="v" style="color:'+(tg&&z.pm<tg?'#8E3A2E':'var(--navy)')+'">'+z.pm+(tg?' <span style="font-size:14px;color:#5E6A7A">من '+tg+'</span>':'')+'</p><p class="s">زيارات هذا الشهر'+(tg?' مقابل المتفق عليه':'')+'</p></div>'})()+'<div class="tile"><p class="k">زمن عرض السعر</p><p class="v">'+(z.qN?dur(z.qSum*60/z.qN):'—')+'</p><p class="s">من الطلب بالبريد إلى الوصول · '+z.qN+' عرض</p></div>'+(con?'':'<div class="tile"><p class="k">قطع معتمدة</p><p class="v">'+(z.spend?Math.round(z.spend).toLocaleString('en')+' ر':'—')+'</p><p class="s">'+z.spendN+' قطعة بتوريد المتعهد</p></div>')+'</div>';
  if(c.type==='ac')h+='<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"><div class="tile"><p class="k">زمن الاستلام</p><p class="v">'+(z.clN?dur(z.clSum/z.clN):'—')+'</p><p class="s">من رفع الطلب إلى «أستلمه» في تيليجرام · '+z.clN+' طلب</p></div></div>';
  if(!con&&z.repN)h+='<div class="card stack" style="gap:8px"><div class="row" style="flex-wrap:wrap"><h3 style="font-size:15px">موثوقية البلاغات <span class="small muted" style="font-weight:600">· مؤشر داخلي لا يُحسب على المتعهد</span></h3><b style="font-size:22px">'+Math.round(100*(z.repN-z.okN)/z.repN)+'٪</b></div><p class="small muted" style="margin:0">'+z.okN+' من '+z.repN+' بلاغاً وُجدت سليمة عند الفحص.</p>'+(Object.keys(z.okBy||{}).length?'<p class="small" style="margin:0">الأكثر: '+Object.keys(z.okBy).sort(function(a,b){return z.okBy[b]-z.okBy[a]}).slice(0,5).map(function(k){return '<span data-nt="1">'+esc(k)+'</span> ('+z.okBy[k]+')'}).join('، ')+'</p>':'')+'</div>';
  var bars=function(t,o){var ks=Object.keys(o).sort(function(a,b){return o[b]-o[a]}).slice(0,5),mx=ks.length?o[ks[0]]:1;return '<div class="card stack" style="gap:10px"><h3 style="font-size:15px">'+t+'</h3>'+(ks.length?'<div class="bars">'+ks.map(function(k){return '<div class="bar"><div><span>'+esc(k)+'</span><i style="width:'+Math.max(6,Math.round(100*o[k]/mx))+'%"></i></div><em>'+o[k]+'</em></div>'}).join('')+'</div>':'<p class="small muted" style="margin:0">لا بيانات بعد.</p>')+'</div>'};
  h+='<h3 style="font-size:16px;margin-top:4px">أنماط الأعطال</h3><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">'+bars('أكثر الأجزاء تعطلاً',z.parts)+bars('أكثر الأسباب',z.causes)+bars(c.type==='el'?'أكثر المصاعد بلاغات':'أكثر المواقع بلاغات',z.locs)+'</div>';
  if(!con){var ks=Object.keys(z.acts||{}).sort(function(a,b){return z.acts[b]-z.acts[a]}),tot=0,miss=0;
   h+='<h3 style="font-size:16px;margin-top:4px">الكشف الشهري: الخدمات المنفذة</h3><div class="card" style="padding:6px 10px;overflow-x:auto">';
   if(!ks.length)h+='<p class="small muted" style="margin:8px 0">لا خدمات مغلقة في هذا الشهر بعد.</p>';
   else{h+='<table class="bill"><thead><tr><th>الخدمة</th><th>العدد</th><th>السعر</th><th>الإجمالي</th></tr></thead><tbody>'+ks.map(function(k){var pc=(d.prices||{})[c.id+'|'+k],n=z.acts[k];if(pc==null)miss++;else tot+=pc*n;return '<tr><td>'+esc(k)+'</td><td>'+n+'</td><td>'+(pc==null?'—':pc)+'</td><td><b>'+(pc==null?'—':Math.round(pc*n*100)/100)+'</b></td></tr>'}).join('')+'</tbody><tfoot><tr><td colspan="3">الإجمالي (ريال)</td><td>'+Math.round(tot*100)/100+'</td></tr></tfoot></table>'}
   if(ks.length)h+='<div style="padding:8px 0"><button class="btn btn-p sm" onclick="P.stmt(\''+c.id+'\')">الكشف للطباعة</button></div>';
   h+='</div><p class="small muted" style="margin:0">من العمليات التي طابقها المهندس وأغلقها في طلبات هذا الشهر. الأسعار من عقد المتعهد'+(miss?' · '+miss+' خدمات بلا سعر':'')+'.</p>'}
  h+='<p class="small muted" style="margin:0;line-height:1.8">الأرقام لطلبات الشهر المختار (حسب تاريخ رفعها)، وتُحدَّث مع كل إجراء. تحت كل نسبة عدد العمليات التي حُسبت منها. البنود الجديدة تُحسب «أخرى» حتى يعتمدها المشرف.</p>';
  return h+'</div>'}
};
