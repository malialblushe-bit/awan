name: Deploy to Apps Script

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      # معرّف نشر تطبيق الويب (يُضاف بعد أول نشر يدوي فيبقى الرابط ثابتاً)
      DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check code
        run: node tests/run.js

      - name: Install clasp
        if: env.CLASPRC_JSON != ''
        run: npm install -g @google/clasp

      - name: Restore clasp credentials
        if: env.CLASPRC_JSON != ''
        run: echo "$CLASPRC_JSON" > ~/.clasprc.json

      - name: Push code
        if: env.CLASPRC_JSON != ''
        run: clasp push --force

      - name: Update web app deployment
        if: env.CLASPRC_JSON != '' && env.DEPLOYMENT_ID != ''
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "${{ github.sha }}"

      - name: Record web app deployment id
        if: env.CLASPRC_JSON != '' && env.DEPLOYMENT_ID == ''
        run: |
          clasp deployments | tee deployments.txt
          ID=$(grep -Eo 'AKfy[A-Za-z0-9_-]+ @[0-9]+' deployments.txt | head -1 | cut -d' ' -f1)
          if [ -z "$ID" ]; then clasp deploy --description "first"; clasp deployments | tee deployments.txt; ID=$(grep -Eo 'AKfy[A-Za-z0-9_-]+ @[0-9]+' deployments.txt | head -1 | cut -d' ' -f1); fi
          echo "$ID" > .deployment-id
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add .deployment-id && git commit -m "Record web app deployment id" && git push || true
